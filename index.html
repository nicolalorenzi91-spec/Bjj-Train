<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diario BJJ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2146B8">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Diario BJJ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: una colonna pensata per iPhone. Tre schede in basso (Diario, Tecniche, Ripasso), fogli a tutto schermo per scrivere. Cifre grandi in carattere condensato, accento blu cintura. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface2:#E6EAF0; --ink:#141C2B; --muted:#586376; --line:#D3DAE4;
  --accent:#2146B8; --accent-ink:#FFFFFF; --accent-soft:#E1E8FA;
  --ok:#17744E; --ok-soft:#DCF0E6; --warn:#8F5508; --warn-soft:#F6EAD3; --bad:#B0322A; --bad-soft:#F7E1DF;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E131B; --surface:#161D28; --surface2:#202A38; --ink:#E8EDF5; --muted:#9AA6B8; --line:#2B3647;
    --accent:#7DA3FF; --accent-ink:#0A1226; --accent-soft:#1B2A4D;
    --ok:#5FD0A0; --ok-soft:#17332A; --warn:#E3B05A; --warn-soft:#382C14; --bad:#FF8F85; --bad-soft:#3B2020;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E131B; --surface:#161D28; --surface2:#202A38; --ink:#E8EDF5; --muted:#9AA6B8; --line:#2B3647;
  --accent:#7DA3FF; --accent-ink:#0A1226; --accent-soft:#1B2A4D;
  --ok:#5FD0A0; --ok-soft:#17332A; --warn:#E3B05A; --warn-soft:#382C14; --bad:#FF8F85; --bad-soft:#3B2020;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font:400 16px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0; -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-block:4px 150px}
.muted{color:var(--muted)} .small{font-size:14px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}

.top{display:flex;align-items:center;justify-content:space-between;padding:12px 0 2px}
.brand{font:700 30px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:0}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;background:transparent;border:1px solid var(--line);border-radius:12px;color:var(--ink)}
svg{display:block}

.btn{min-height:44px;padding:10px 16px;border-radius:10px;border:1px solid transparent;font:600 16px var(--body);background:var(--surface2);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{min-height:40px;padding:6px 14px;font-size:15px}
.btn.block{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}

/* Cifre di sintesi */
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:10px 0 16px}
.stat{padding:12px 10px 10px 0}
.stat+.stat{border-left:1px solid var(--line);padding-left:12px}
.stat b{display:block;font:700 42px/1 var(--display);font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:4px;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

/* Settimana */
.week{margin-bottom:16px}
.wh{display:flex;justify-content:space-between;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.wr{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wc{display:flex;flex-direction:column;align-items:center;gap:4px;font:600 12px var(--body);color:var(--muted)}
.wc i{font-style:normal}
.wc b{display:block;width:100%;height:30px;border-radius:8px;background:var(--surface2)}
.wc.on b{background:var(--accent)}
.wc.now b{outline:2px solid var(--accent);outline-offset:2px}
.wc.fut{opacity:.55}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--warn-soft);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.nudge{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:var(--accent-soft);border:0;border-radius:10px;padding:12px 14px;margin-bottom:14px;font:500 15px var(--body);text-align:left}
.nudge em{font-style:normal;font-weight:600;color:var(--accent);white-space:nowrap}

.grp{display:flex;justify-content:space-between;align-items:baseline;font:700 15px var(--display);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:22px 0 8px;padding:0}
.grp small{font:500 13px var(--body);letter-spacing:0;text-transform:none}

.sess{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.sd{display:flex;flex-direction:column;align-items:center;line-height:1}
.sd b{font:700 34px/1 var(--display);font-variant-numeric:tabular-nums}
.sd i{font:600 12px var(--body);font-style:normal;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:4px}
.sb{display:flex;flex-direction:column;gap:6px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:13px;color:var(--muted)}
.chip{display:inline-flex;padding:1px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;letter-spacing:.03em}
.tn{display:block;font-weight:500;padding-left:12px;position:relative;overflow-wrap:anywhere}
.tn::before{content:"";position:absolute;left:0;top:.55em;width:6px;height:6px;background:var(--accent);border-radius:1px}
.pv{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}

.empty{padding:36px 8px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font:700 24px/1.1 var(--display);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}

/* Tecniche */
.tools{display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:10px;margin:12px 0 10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fc{flex:none;min-height:36px;padding:4px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;white-space:nowrap}
.fc[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px;min-height:56px}
.tmain{display:flex;flex-direction:column;min-width:0}
.tname{font-weight:600;overflow-wrap:anywhere}
.tsub{font-size:13px;color:var(--muted)}
.tside{display:flex;align-items:center;gap:10px;flex:none}
.due-pill{font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:2px 9px}
.meter{display:inline-flex;gap:3px;align-items:flex-end}
.meter i{width:5px;border-radius:2px;background:var(--line)}
.meter i:nth-child(1){height:8px}.meter i:nth-child(2){height:11px}.meter i:nth-child(3){height:14px}
.meter i.on{background:var(--accent)}

/* Ripasso */
.bignum{display:flex;align-items:baseline;gap:12px;margin:14px 0 8px}
.bignum b{font:700 72px/1 var(--display);font-variant-numeric:tabular-nums}
.bignum span{font-size:17px;color:var(--muted)}
.up{display:flex;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}
.up span{min-width:0;overflow-wrap:anywhere}
.up small{color:var(--muted);flex:none}
.rvh{display:flex;justify-content:space-between;align-items:center;margin:10px 0 8px;font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--surface2);margin-bottom:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.flash{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 18px;min-height:240px;display:flex;flex-direction:column;gap:14px;margin-bottom:14px}
.fk{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fn{font:700 36px/1.05 var(--display);overflow-wrap:anywhere}
.fp{white-space:pre-wrap;font-size:17px;overflow-wrap:anywhere}
.fl{border-left:3px solid var(--accent);padding-left:12px;font-size:15px;overflow-wrap:anywhere}
.fl small{display:block;color:var(--muted);margin-bottom:2px}
.rate{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rate .btn{min-height:56px;font-size:17px}
.again{background:var(--bad-soft);color:var(--bad)}
.okb{background:var(--ok-soft);color:var(--ok)}
.sumrow{padding:8px 0;border-bottom:1px solid var(--line)}

/* Tab bar e pulsante */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--muted);font:600 12px var(--body);padding:6px 4px;min-height:48px}
.tabs button[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:9;display:flex;align-items:center;gap:8px;min-height:52px;padding:0 20px 0 14px;border-radius:999px;background:var(--accent);color:var(--accent-ink);border:0;font:700 16px var(--body);box-shadow:0 6px 18px rgba(10,20,50,.3)}

/* Fogli */
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.sheet-head h2{margin:0;font:700 22px/1 var(--display);text-transform:uppercase;letter-spacing:.05em}
.sheet-body{max-width:640px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(48px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-body h3{font:700 20px/1.1 var(--display);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 10px}

input,select,textarea{width:100%;min-width:0;font:inherit;font-size:16px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px;text-overflow:ellipsis}
textarea{resize:vertical;line-height:1.4}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.f>span{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;min-height:44px;padding:8px 6px;background:var(--surface);border:0;border-right:1px solid var(--line);font-weight:500}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.ih{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ih b{overflow-wrap:anywhere}
.ih small{display:block;color:var(--muted)}
.x{flex:none;width:44px;height:44px;margin:-8px -8px 0 0;background:none;border:0;color:var(--muted);display:grid;place-items:center}
.item textarea{margin-top:8px}
.addbox{border:1px dashed var(--muted);border-radius:12px;padding:14px;margin:14px 0 22px}
.hint{font-size:13px;color:var(--muted);margin:0 0 6px}
.sg{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px;min-height:44px}
.sg small{color:var(--muted);flex:none}
.hrow{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.hrow small{display:block;color:var(--muted);overflow-wrap:anywhere}
.stline{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px}
.kv{font-size:14px;color:var(--muted);margin:0 0 12px}
.lnk{display:inline-block;margin:0 0 14px;color:var(--accent);font-weight:600}

.dlg{position:fixed;inset:0;z-index:50;background:rgba(8,12,20,.55);display:grid;place-items:center;padding:20px}
.dlg-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:360px;width:100%}
.dlg-box p{margin:0 0 16px}
.dlg-act{display:flex;gap:10px;justify-content:flex-end}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,6px)}}}

[hidden]{display:none!important}
.sub{display:flex;align-items:center;gap:8px;font:600 13px var(--body);letter-spacing:.06em;text-transform:uppercase;margin:12px 0 0;color:var(--ink)}
.sub::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent)}
.sub.difesa::before{background:var(--warn)}
.sub small{font-weight:500;color:var(--muted);letter-spacing:0;text-transform:none}
.rtag{display:inline-block;font:600 12px var(--body);border-radius:999px;padding:1px 9px;background:var(--accent-soft);color:var(--accent);vertical-align:1px}
.rtag.difesa{background:var(--warn-soft);color:var(--warn)}
.tools+.seg,.chips+.seg{margin:4px 0 6px}
.seg.top{margin:0 0 8px}
.vrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.vid{display:block;width:100%;max-height:60vh;border-radius:14px;background:#000;margin:0 0 4px}
.flash .vid{margin:2px 0}
.clipbox{margin-bottom:6px}
.cliphint{margin:6px 0 0}
.clip{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.cthumb{width:72px;height:54px;border-radius:8px;object-fit:cover;background:#000;pointer-events:none;display:block}
.clip b{display:block;font-weight:600;overflow-wrap:anywhere}
.clip small{display:block;color:var(--muted);overflow-wrap:anywhere}
.pkvid{margin:2px 0 12px}
.pkvid .tag{display:block;margin-top:6px}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1 class="brand">Diario BJJ</h1>
    <button type="button" class="iconbtn" data-act="settings" aria-label="Backup e dati">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg>
    </button>
  </header>
  <main id="main"></main>
</div>

<button type="button" class="fab" id="fab" data-act="new-sess" hidden>
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  <span id="fabl">Allenamento</span>
</button>

<nav class="tabs" aria-label="Sezioni">
  <button type="button" data-act="tab" data-v="diario">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>Diario</button>
  <button type="button" data-act="tab" data-v="tech">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6h14M5 12h14M5 18h9"/></svg>Tecniche</button>
  <button type="button" data-act="tab" data-v="ripasso">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="14" height="12" rx="2"/><path d="M7 8V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/></svg>Ripasso</button>
</nav>

<div class="sheet" id="sheet" hidden></div>
<div class="dlg" id="dlg" hidden>
  <div class="dlg-box" role="dialog" aria-modal="true" aria-labelledby="dlgMsg">
    <p id="dlgMsg"></p>
    <div class="dlg-act">
      <button type="button" class="btn ghost" data-act="dlg-no">Annulla</button>
      <button type="button" class="btn danger" id="dlgYes" data-act="dlg-yes">Elimina</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
'use strict';
var LS='diario-bjj-v1';
var POS=['In piedi','Guardia chiusa','Guardia aperta','Mezza guardia','Controllo laterale','Ginocchio sulla pancia','Montata','Schiena','Tartaruga','Altro'];
var CAT=['Sottomissione','Sweep','Passaggio','Fuga','Takedown','Transizione','Controllo'];
var KIND={gi:'Gi',nogi:'No-Gi',open:'Open mat'};
var LEVEL=['Vista','In pratica','Mi riesce'];
var ROLE={attacco:'Attacco',difesa:'Difesa'};
var VID_MAX=300*1024*1024;
var INTERVALS=[1,3,7,16,35,70];
var WD=['L','M','M','G','V','S','D'];
var DRE=/^\d{4}-\d\d-\d\d$/;

var S=null, TM={}, SEEN={};
var view='diario', dr=null, pk=null, td=null, rv=null, dlgCb=null, status='local';
var tf={q:'',pos:'',cat:'',role:''}, rf={pos:'',role:''};
var lastKind='gi', lastPos='Guardia chiusa', lastCat='Sottomissione', lastCoach='', lastRole='attacco';
var cloud={ref:null}, cd=null, clipUp=false, sheetUp=[], sheetOld=[], sheetGen=0;

/* ---------- utilità ---------- */
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function pad(n){return n<10?'0'+n:''+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return ymd(new Date())}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d)}
function diffDays(a,b){return Math.round((parse(a)-parse(b))/86400000)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function find(arr,id){for(var i=0;i<arr.length;i++){if(arr[i].id===id)return arr[i]}return null}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim()}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function opts(list,sel){return list.map(function(x){return '<option'+(x===sel?' selected':'')+'>'+esc(x)+'</option>'}).join('')}
var fmtMonth=new Intl.DateTimeFormat('it-IT',{month:'long',year:'numeric'});
var fmtLong=new Intl.DateTimeFormat('it-IT',{weekday:'long',day:'numeric',month:'long'});
var fmtShort=new Intl.DateTimeFormat('it-IT',{day:'numeric',month:'short'});
var fmtWd=new Intl.DateTimeFormat('it-IT',{weekday:'short'});
function wdShort(d){return fmtWd.format(d).replace('.','')}
function rel(s){
  var n=diffDays(s,today());
  if(n===0)return 'oggi'; if(n===1)return 'domani'; if(n===-1)return 'ieri';
  return n>0?('fra '+n+' giorni'):((-n)+' giorni fa');
}

function valid(o){return !!o&&Array.isArray(o.techniques)&&Array.isArray(o.sessions)}
function cleanVideo(v){
  if(!v||typeof v!=='object'||!/^[0-9a-f]{32}$/.test(String(v.id)))return null;
  return {id:String(v.id),name:String(v.name||'Video').slice(0,80),size:Math.max(0,+v.size||0)};
}
function blank(){return {v:1,updatedAt:0,demo:false,techniques:[],sessions:[],clips:[]}}
function normalise(o){
  var out=blank();
  out.updatedAt=+o.updatedAt||0; out.demo=!!o.demo;
  var ids={};
  o.techniques.forEach(function(t){
    if(!t||!t.id||!t.name||ids[t.id])return;
    ids[t.id]=1;
    out.techniques.push({
      id:String(t.id),name:String(t.name),
      position:POS.indexOf(t.position)>=0?t.position:'Altro',
      category:CAT.indexOf(t.category)>=0?t.category:'Transizione',
      role:ROLE[t.role]?t.role:(t.category==='Fuga'?'difesa':'attacco'),video:cleanVideo(t.video),
      level:[1,2,3].indexOf(+t.level)>=0?+t.level:1,
      points:String(t.points||''),link:String(t.link||''),
      created:DRE.test(t.created)?t.created:today(),
      box:Math.min(5,Math.max(0,+t.box||0)),last:DRE.test(t.last)?t.last:null,
      due:DRE.test(t.due)?t.due:addDays(today(),1),demo:!!t.demo
    });
  });
  (Array.isArray(o.clips)?o.clips:[]).forEach(function(c){
    var v=c&&cleanVideo(c.video);
    if(!v)return;
    out.clips.push({id:String(c.id||uid()),date:DRE.test(c.date)?c.date:today(),note:String(c.note||'').slice(0,2000),name:String(c.name||'').slice(0,200),
      position:POS.indexOf(c.position)>=0?c.position:'Altro',role:ROLE[c.role]?c.role:'attacco',category:CAT.indexOf(c.category)>=0?c.category:'Transizione',
      points:String(c.points||'').slice(0,5000),video:v});
  });
  o.sessions.forEach(function(s){
    if(!s||!s.id||!DRE.test(s.date))return;
    out.sessions.push({
      id:String(s.id),date:s.date,kind:KIND[s.kind]?s.kind:'gi',
      minutes:Math.max(0,parseInt(s.minutes,10)||0),coach:String(s.coach||''),note:String(s.note||''),
      items:(Array.isArray(s.items)?s.items:[]).filter(function(i){return i&&ids[i.tid]}).map(function(i){return {tid:String(i.tid),note:String(i.note||'')}}),
      demo:!!s.demo
    });
  });
  return out;
}

/* ---------- video ---------- */
function videoHtml(v){return '<video class="vid" controls playsinline preload="metadata" data-vid="'+esc(v.id)+'"></video>'}
function vidType(f){return f.type||'video/mp4'}
function vidErrMsg(e){
  var c=e&&e.code;
  return c==='too_large'?'Video troppo pesante: massimo 300 MB. Accorcialo da Foto → Modifica.'
    :c==='quota_or_state'?'Spazio del telefono esaurito: rimuovi qualche video'
    :c==='nostore'?'Questo browser non permette di salvare video qui'
    :'Caricamento non riuscito, riprova';
}
/* archivio dei video sul telefono */
var idbP=null,urlCache={};
function idb(){
  if(idbP)return idbP;
  idbP=new Promise(function(res,rej){
    if(!window.indexedDB){rej({code:'nostore'});return}
    var rq=indexedDB.open('diario-bjj-video',1);
    rq.onupgradeneeded=function(){rq.result.createObjectStore('v')};
    rq.onsuccess=function(){res(rq.result)};
    rq.onerror=function(){idbP=null;rej({code:'nostore'})};
  });
  return idbP;
}
function vtx(mode,fn){
  return idb().then(function(db){
    return new Promise(function(res,rej){
      var tx=db.transaction('v',mode),r=fn(tx.objectStore('v'));
      tx.oncomplete=function(){res(r&&r.result)};
      tx.onerror=tx.onabort=function(){var n=tx.error&&tx.error.name;rej({code:n==='QuotaExceededError'?'quota_or_state':'err'})};
    });
  });
}
function vput(id,blob){return vtx('readwrite',function(s){return s.put(blob,id)})}
function vget(id){return vtx('readonly',function(s){return s.get(id)})}
function vdel(id){
  if(urlCache[id]){try{URL.revokeObjectURL(urlCache[id])}catch(e){}delete urlCache[id]}
  return vtx('readwrite',function(s){return s.delete(id)});
}
function vurl(id){
  if(urlCache[id])return Promise.resolve(urlCache[id]);
  return vget(id).then(function(b){
    if(!b)return null;
    urlCache[id]=URL.createObjectURL(b);return urlCache[id];
  }).catch(function(){return null});
}
function hydrate(){
  document.querySelectorAll('video[data-vid]:not([data-ok])').forEach(function(el){
    el.setAttribute('data-ok','1');
    vurl(el.getAttribute('data-vid')).then(function(u){
      if(!el.isConnected)return;
      if(!u){
        if(!el.classList.contains('cthumb')){var p=document.createElement('p');p.className='muted small';p.textContent='Video non disponibile su questo telefono.';el.replaceWith(p)}
        return;
      }
      el.src=el.classList.contains('cthumb')?u+'#t=0.1':u;
    });
  });
}
var hyT=null;
new MutationObserver(function(){clearTimeout(hyT);hyT=setTimeout(hydrate,0)}).observe(document.documentElement,{childList:true,subtree:true});
function rid32(){
  var a=new Uint8Array(16),s='';
  if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);else for(var i=0;i<16;i++)a[i]=Math.floor(Math.random()*256);
  for(var j=0;j<16;j++)s+=(a[j]<16?'0':'')+a[j].toString(16);
  return s;
}
function dropAssets(ids){
  if(!ids||!ids.length)return;
  ids.forEach(function(id){vdel(id).catch(function(){})});
}
function usedVideos(){
  var u={};
  S.techniques.forEach(function(t){if(t.video)u[t.video.id]=1});
  S.clips.forEach(function(c){u[c.video.id]=1});
  return u;
}
/* a fine foglio elimina i file caricati o tolti che nessuna scheda usa piu' */
function dropUnused(){
  var u=usedVideos(),gone=[];
  sheetUp.concat(sheetOld).forEach(function(id){if(!u[id]&&gone.indexOf(id)<0)gone.push(id)});
  sheetUp=[];sheetOld=[];
  dropAssets(gone);
}
function uploadVideo(file){
  if(file.size>VID_MAX)return Promise.reject({code:'too_large'});
  var id=rid32();
  var blob=file.slice(0,file.size,vidType(file));
  return vput(id,blob).then(function(){
    return {id:id,name:String(file.name||'Video').slice(0,80),size:file.size};
  });
}
/* upload dentro un foglio: il file resta "in prova" finche' non si salva */
function sheetUpload(file,done,fail){
  var gen=sheetGen;
  uploadVideo(file).then(function(v){
    if(gen!==sheetGen){dropAssets([v.id]);return}
    sheetUp.push(v.id);done(v);
  }).catch(function(e){fail();toast(vidErrMsg(e))});
}
function roleSeg(id,act,cur,all,cls){

  if(all)h+='<button type="button" data-act="'+act+'" data-v="" aria-pressed="'+(cur==='')+'">Tutti</button>';
  Object.keys(ROLE).forEach(function(r){h+='<button type="button" data-act="'+act+'" data-v="'+r+'" aria-pressed="'+(cur===r)+'">'+ROLE[r]+'</button>'});
  return h+'</div>';
}

function saveClip(){
  var c=cd&&find(S.clips,cd.id);
  if(!c){closeSheet();render();return}
  var name=cd.name.trim().replace(/\s+/g,' ');
  c.note=cd.note.trim();c.name=name;c.position=cd.position;c.role=cd.role;c.category=cd.category;c.points=cd.points.trim();
  if(DRE.test(cd.date))c.date=cd.date;
  if(!name){touch();closeSheet();render();toast('Appunto salvato');return}
  var t=S.techniques.filter(function(x){return norm(x.name)===norm(name)})[0],made=false;
  if(t){
    if(t.video&&t.video.id!==c.video.id)sheetOld.push(t.video.id);
    t.video=c.video;
    if(c.points&&(t.points||'').indexOf(c.points)<0)t.points=t.points?t.points+'\n'+c.points:c.points;
  }else{
    t={id:uid(),name:name,position:c.position,role:c.role,category:c.category,level:1,points:c.points,link:'',video:c.video,created:today(),box:0,last:null,due:addDays(today(),1)};
    S.techniques.push(t);made=true;
  }
  var ses=null;
  if(cd.sess==='new'){
    ses={id:uid(),date:c.date,kind:lastKind,minutes:60,coach:lastCoach,note:'',items:[],demo:false};
    S.sessions.push(ses);
  }else if(cd.sess)ses=find(S.sessions,cd.sess);
  if(ses&&!ses.items.some(function(i){return i.tid===t.id}))ses.items.push({tid:t.id,note:c.note});
  S.clips=S.clips.filter(function(x){return x.id!==c.id});
  lastPos=c.position;lastRole=c.role;
  touch();closeSheet();render();
  toast((made?'Tecnica creata':'Video aggiunto a «'+t.name+'»')+(ses?' e collegata all\'allenamento':''));
}

/* ---------- salvataggio ---------- */
var saveTimer=null,saving=false,dirty=false;
function setStatus(s){
  var was=status;status=s;
  if((s==='err'||s==='quota')&&was!==s)toast(s==='quota'?'Spazio nel tuo account esaurito: fai un backup':'Salvataggio nel tuo account non riuscito');
}
function touch(){
  S.updatedAt=Date.now();dirty=true;
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  clearTimeout(saveTimer);saveTimer=setTimeout(flush,500);
}
function flush(){
  if(!cloud.ref||saving||!dirty)return;
  saving=true;dirty=false;
  cloud.ref.set(clone(S)).then(function(){saving=false;setStatus('ok');if(dirty)flush()})
    .catch(function(e){saving=false;dirty=true;setStatus(e&&e.code==='quota_exceeded'?'quota':'err')});
}
function initCloud(tries){
  if(!window.claude||typeof window.claude.use!=='function'){
    if(tries<6)setTimeout(function(){initCloud(tries+1)},500); else status='local';
    return;
  }
  Promise.all([claude.use('db'),claude.use('user')]).then(function(r){
    var db=r[0],user=r[1];
    if(!db||!user){status='local';return}
    return Promise.resolve(user.id()).then(function(id){
      if(!id){status='local';return}
      cloud.ref=db.collection('data/users/'+id).doc('bjj');
      return cloud.ref.get().then(function(snap){
        if(snap.exists){
          var d=snap.data();
          if(valid(d)&&(+d.updatedAt||0)>=(S.updatedAt||0)){
            S=normalise(clone(d));
            try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
            render();
          }else if(S.updatedAt>0){dirty=true;flush()}
        }else if(S.updatedAt>0){dirty=true;flush()}
        status='ok';
      });
    });
  }).catch(function(){status='local'});
}
function statusText(){
  if(status==='ok')return 'I dati sono salvati nel tuo account e li ritrovi anche aprendo il diario da un altro dispositivo.';
  if(status==='err')return 'Il salvataggio nel tuo account non è riuscito. I dati restano su questo dispositivo: fai un backup.';
  if(status==='quota')return 'Lo spazio nel tuo account è esaurito. I dati restano su questo dispositivo: fai un backup.';
  if(status==='local')return 'Gli allenamenti e le tecniche sono salvati su questo telefono, dentro l\'app. Ogni tanto fai un backup. I video restano sul telefono e non sono nel file di backup.';
  return 'Collegamento al tuo account in corso…';
}

/* ---------- viste ---------- */
function stat(v,l){return '<div class="stat"><b>'+esc(v)+'</b><span>'+esc(l)+'</span></div>'}
function weekHtml(){
  var t=today(),wd=(new Date().getDay()+6)%7,mon=addDays(t,-wd),set={},cnt=0,cells='';
  S.sessions.forEach(function(s){set[s.date]=1});
  for(var i=0;i<7;i++){
    var d=addDays(mon,i),on=!!set[d];if(on)cnt++;
    cells+='<span class="wc'+(on?' on':'')+(d===t?' now':'')+(d>t?' fut':'')+'"><i>'+WD[i]+'</i><b></b></span>';
  }
  return '<div class="week"><div class="wh"><span>Questa settimana</span><span>'+cnt+(cnt===1?' allenamento':' allenamenti')+'</span></div><div class="wr">'+cells+'</div></div>';
}
function sessCard(s){
  var d=parse(s.date);
  var names=s.items.map(function(i){return TM[i.tid]}).filter(Boolean);
  var tl=names.slice(0,4).map(function(n){return '<span class="tn">'+esc(n.name)+'</span>'}).join('');
  if(names.length>4)tl+='<span class="tn muted">+ altre '+(names.length-4)+'</span>';
  if(!names.length)tl='<span class="muted small">Nessuna tecnica registrata</span>';
  return '<button type="button" class="sess" data-act="sess" data-id="'+esc(s.id)+'">'
    +'<span class="sd"><b>'+d.getDate()+'</b><i>'+esc(wdShort(d))+'</i></span>'
    +'<span class="sb"><span class="meta"><span class="chip">'+esc(KIND[s.kind])+'</span>'+(s.minutes?'<span>'+s.minutes+' min</span>':'')+(s.coach?'<span>'+esc(s.coach)+'</span>':'')+'</span>'
    +'<span>'+tl+'</span>'
    +(s.note?'<span class="pv">'+esc(s.note)+'</span>':'')
    +'</span></button>';
}
function vDiario(){
  var n=S.sessions.length;
  var mins=S.sessions.reduce(function(a,s){return a+(s.minutes||0)},0);
  var hrs=String(Math.round(mins/6)/10).replace('.',',');
  var h='<div class="stats">'+stat(n,'Allenamenti')+stat(hrs,'Ore sul tatami')+stat(S.techniques.length,'Tecniche')+'</div>';
  h+=weekHtml();
  if(S.demo)h+='<div class="banner"><span>Stai vedendo dati di esempio.</span><button type="button" class="btn ghost sm" data-act="clear-demo">Elimina esempi</button></div>';
  var due=dueCount();
  if(due)h+='<button type="button" class="nudge" data-act="goto-rev"><span><b>'+due+'</b> '+(due===1?'tecnica da ripassare':'tecniche da ripassare')+'</span><em>Ripassa →</em></button>';
  h+=clipBox();
  if(!n){
    h+='<div class="empty"><strong>Nessun allenamento</strong>Dopo la lezione allega un video, oppure tocca «Allenamento» e scrivi cosa hai imparato.</div>';
  }else{
    var list=S.sessions.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0}),cur='';
    list.forEach(function(s){
      var m=s.date.slice(0,7);
      if(m!==cur){cur=m;h+='<h2 class="grp">'+esc(cap(fmtMonth.format(parse(s.date))))+'</h2>'}
      h+=sessCard(s);

function meter(l){
  return '<span class="meter" role="img" aria-label="'+esc(LEVEL[l-1])+'"><i class="'+(l>=1?'on':'')+'"></i><i class="'+(l>=2?'on':'')+'"></i><i class="'+(l>=3?'on':'')+'"></i></span>';
}
function techList(){
  var q=norm(tf.q);
  var list=S.techniques.filter(function(t){
    return (!tf.pos||t.position===tf.pos)&&(!tf.role||t.role===tf.role)&&(!tf.cat||t.category===tf.cat)&&(!q||norm(t.name).indexOf(q)>=0||norm(t.points).indexOf(q)>=0);
  });
  if(!S.techniques.length)return '<div class="empty"><strong>Libreria vuota</strong>Le tecniche che aggiungi agli allenamenti finiscono qui, divise per posizione e per ruolo: attacco o difesa.</div>';
  if(!list.length)return '<div class="empty"><strong>Nessun risultato</strong>Prova a togliere un filtro.</div>';
  var h='';
  POS.forEach(function(p){
    var g=list.filter(function(t){return t.position===p});
    if(!g.length)return;
    h+='<h2 class="grp">'+esc(p)+'<small>'+g.length+'</small></h2>';
    Object.keys(ROLE).forEach(function(r){
      var gg=g.filter(function(t){return t.role===r}).sort(function(a,b){return a.name.localeCompare(b.name,'it')});
      if(!gg.length)return;
      h+='<h3 class="sub '+r+'">'+ROLE[r]+'<small>'+gg.length+'</small></h3>';
      gg.forEach(function(t){
        var seen=SEEN[t.id]||0;
        h+='<button type="button" class="trow" data-act="tech" data-id="'+esc(t.id)+'"><span class="tmain"><span class="tname">'+esc(t.name)+'</span><span class="tsub">'+esc(t.category)+(t.video?' · con video':'')+(seen?' · vista in '+seen+(seen===1?' lezione':' lezioni'):'')+'</span></span><span class="tside">'+(isDue(t)?'<span class="due-pill">Ripasso</span>':'')+meter(t.level)+'</span></button>';
      });
    });
  });
  return h;
}
function posChips(cur,act){
  var used=POS.filter(function(p){return S.techniques.some(function(t){return t.position===p})});
  function chip(v,l){return '<button type="button" class="fc" data-act="'+act+'" data-v="'+esc(v)+'" aria-pressed="'+(cur===v)+'">'+esc(l)+'</button>'}
  return '<div class="chips">'+chip('','Tutte')+used.map(function(p){return chip(p,p)}).join('')+'</div>';
}
function vTech(){
  return '<div class="tools"><input type="search" id="tq" placeholder="Cerca una tecnica" value="'+esc(tf.q)+'" autocomplete="off" aria-label="Cerca"><select id="tc" aria-label="Categoria"><option value="">Categoria</option>'+opts(CAT,tf.cat)+'</select></div>'
    +posChips(tf.pos,'tpos')+roleSeg('segTRole','trole',tf.role,true,'top')+'<div id="tlist">'+techList()+'</div>';
}
function lastNote(tid){
  var ss=sessionsOf(tid);
  for(var i=0;i<ss.length;i++){var it=ss[i].items.filter(function(x){return x.tid===tid})[0];if(it&&it.note)return {note:it.note,date:ss[i].date}}
  return null;
}
function vRipasso(){
  if(rv){return rv.i>=rv.deck.length?rvDone():rvCard()}
  if(!S.techniques.length)return '<div class="empty"><strong>Niente da ripassare</strong>Registra le tecniche negli allenamenti: qui le ritrovi al momento giusto.</div>';
  var pool=S.techniques.filter(function(t){return (!rf.pos||t.position===rf.pos)&&(!rf.role||t.role===rf.role)});
  var due=pool.filter(isDue);
  var h='<div class="bignum"><b>'+due.length+'</b><span>'+(due.length===1?'tecnica da ripassare':'tecniche da ripassare')+(rf.pos||rf.role?' · '+esc([rf.pos,rf.role?ROLE[rf.role]:''].filter(Boolean).join(' · ')):' oggi')+'</span></div>';
  h+=posChips(rf.pos,'rpos');
  h+=roleSeg('segRRole','rrole',rf.role,true,'top');
  if(due.length)h+='<button type="button" class="btn primary block" data-act="rv-start">Inizia il ripasso ('+Math.min(10,due.length)+')</button>';
  else if(pool.length)h+='<p class="muted">Niente in scadenza. Torna domani, oppure ripassa lo stesso.</p><button type="button" class="btn ghost block" data-act="rv-force">Ripassa comunque '+Math.min(5,pool.length)+' tecniche</button>';
  else h+='<p class="muted">Nessuna tecnica con questi filtri.</p>';
  var up=pool.filter(function(t){return !isDue(t)}).sort(function(a,b){return a.due<b.due?-1:1}).slice(0,5);
  if(up.length){
    h+='<h2 class="grp">Prossimi ripassi</h2>'+up.map(function(t){return '<div class="up"><span>'+esc(t.name)+' '+rtag(t.role)+'</span><small>'+esc(rel(t.due))+'</small></div>'}).join('');
  }
  return h;
}
function rvCard(){
  var t=TM[rv.deck[rv.i]];
  if(!t){rv.i++;return vRipasso()}
  var pct=Math.round(rv.i/rv.deck.length*100);
  var h='<div class="rvh"><span>'+(rv.i+1)+' / '+rv.deck.length+'</span><button type="button" class="btn ghost sm" data-act="rv-stop">Esci</button></div><div class="bar"><i style="width:'+pct+'%"></i></div>';
  h+='<div class="flash"><div class="fk">'+esc(t.position)+' · '+esc(t.category)+'</div><div>'+rtag(t.role)+'</div><div class="fn">'+esc(t.name)+'</div>';
  if(rv.revealed){
    var ln=lastNote(t.id);
    if(t.video)h+=videoHtml(t.video);
    h+='<div class="fp">'+(t.points?esc(t.points):'<span class="muted">Non hai ancora scritto punti chiave per questa tecnica.</span>')+'</div>';
    if(ln)h+='<div class="fl"><small>Dall\'allenamento del '+esc(fmtShort.format(parse(ln.date)))+'</small>'+esc(ln.note)+'</div>';
    if(/^https?:\/\//i.test(t.link))h+='<a class="lnk" href="'+esc(t.link)+'" target="_blank" rel="noopener noreferrer">Apri il video</a>';
    h+='<div><button type="button" class="btn ghost sm" data-act="tech" data-id="'+esc(t.id)+'">Modifica scheda</button></div>';
  }else{
    h+='<p class="muted" style="margin:0">Prova a ricordare i passaggi, poi controlla.</p>';
  }
  h+='</div>';
  h+=rv.revealed?'<div class="rate"><button type="button" class="btn again" data-act="rv-again">Da rivedere</button><button type="button" class="btn okb" data-act="rv-ok">Ricordata</button></div>'
    :'<button type="button" class="btn primary block" data-act="rv-show">Mostra i punti chiave</button>';
  return h;
}
function rvDone(){
  var h='<div class="bignum"><b>'+rv.ok+'</b><span>ricordate su '+rv.deck.length+'</span></div>';
  if(rv.again.length){
    h+='<h2 class="grp">Da rivedere</h2>'+rv.again.map(function(id){var t=TM[id];return t?'<div class="sumrow">'+esc(t.name)+'</div>':''}).join('');
    h+='<p class="muted small">Le ritrovi domani nel ripasso.</p>';
  }else h+='<p class="muted">Tutte ricordate. Le ripropongo con intervalli più lunghi.</p>';
  h+='<button type="button" class="btn primary block" data-act="rv-stop">Fine</button>';
  return h;
}
function render(){
  index();
  document.querySelectorAll('.tabs button').forEach(function(b){b.setAttribute('aria-current',b.dataset.v===view?'page':'false')});
  $('#main').innerHTML=view==='diario'?vDiario():view==='tech'?vTech():vRipasso();
  var fab=$('#fab');
  if(view==='diario'){fab.hidden=false;fab.dataset.act='new-sess';$('#fabl').textContent='Allenamento'}
  else if(view==='tech'){fab.hidden=false;fab.dataset.act='new-tech';$('#fabl').textContent='Tecnica'}

function attach(tid){

function clearPicker(){

function addTech(){
  if(pk._up){toast('Aspetta la fine del caricamento del video');return}
  var name=pk.name.trim().replace(/\s+/g,' ');
  if(!name){toast('Scrivi il nome della tecnica');$('#pkName').focus();return}
  var t=null;
  S.techniques.forEach(function(x){if(norm(x.name)===norm(name))t=x});
  if(!t){
    var d=dr.date||today();
    t={id:uid(),name:name,position:pk.pos,role:pk.role,category:pk.cat,level:1,points:pk.pts.trim(),link:'',video:pk.video||null,created:d,box:0,last:null,due:addDays(d,1)};
    S.techniques.push(t);dr._new.push(t.id);lastPos=pk.pos;lastCat=pk.cat;lastRole=pk.role;

function saveSession(){
  if(!DRE.test(dr.date||'')){toast('Scegli la data');return}
  index();
  var items=dr.items.filter(function(i){return TM[i.tid]}).map(function(i){return {tid:i.tid,note:i.note.trim()}});
  var keep={};items.forEach(function(i){keep[i.tid]=1});
  // tecniche nuove create e poi tolte dalla lista: non servono
  S.techniques=S.techniques.filter(function(t){return !(dr._new.indexOf(t.id)>=0&&!keep[t.id])});
  // le tecniche nuove nascono alla data dell'allenamento
  S.techniques.forEach(function(t){if(dr._new.indexOf(t.id)>=0){t.created=dr.date;t.due=addDays(dr.date,1)}});
  var old=dr.id?find(S.sessions,dr.id):null;
  var obj={id:dr.id||uid(),date:dr.date,kind:dr.kind,minutes:Math.max(0,parseInt(dr.minutes,10)||0),coach:(dr.coach||'').trim(),note:(dr.note||'').trim(),items:items,demo:old?old.demo:false};

  lastKind=obj.kind;lastCoach=obj.coach;
  dr._new=[];
  touch();closeSheet();render();toast('Allenamento salvato');
}

   +'<p class="stline">'+esc(statusText())+'</p>'
   +'<h3>Backup</h3><p class="muted small">Un file con tutti gli allenamenti e le tecniche. Conservalo in un posto sicuro, per esempio nei File.</p>'
   +'<div class="btns"><button type="button" class="btn primary" data-act="bk-save">Salva il file</button><button type="button" class="btn ghost" data-act="bk-copy">Copia come testo</button></div>'
   +'<textarea id="bkText" rows="6" readonly hidden></textarea>'
   +'<h3>Ripristina</h3><p class="muted small">Carica un backup. Sostituisce i dati che vedi ora.</p>'
   +'<label class="btn ghost" style="display:inline-block;text-align:center">Scegli il file<input type="file" id="impFile" class="vh" accept=".json,application/json"></label>'
   +'<h3>Pulizia</h3><div class="btns">'
   +(S.demo?'<button type="button" class="btn ghost" data-act="clear-demo">Elimina i dati di esempio</button>':'')
   +'<button type="button" class="btn danger" data-act="wipe">Cancella tutto</button></div>'
   +'</div>';
  openSheet(h);
}
function backupText(){return JSON.stringify(S,null,1)}
function backupName(){return 'diario-bjj-'+today()+'.json'}
function copyBackup(){
  var txt=backupText();
  function fallback(){var ta=$('#bkText');if(!ta)return;ta.hidden=false;ta.value=txt;ta.focus();ta.select();toast('Copia il testo selezionato')}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){toast('Backup copiato')}).catch(fallback);
  }else fallback();
}
function saveBackup(){
  var txt=backupText();
  try{
    var b=new Blob([txt],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download=backupName();document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
    toast('Backup salvato');
  }catch(e){copyBackup()}
}
function importFile(file){
  var r=new FileReader();
  r.onload=function(){
    var o;try{o=JSON.parse(r.result)}catch(e){toast('Il file non è un backup valido');return}
    if(!valid(o)){toast('Il file non è un backup di questo diario');return}
    askConfirm('Sostituire i dati attuali con il backup ('+o.sessions.length+' allenamenti, '+o.techniques.length+' tecniche)?','Sostituisci',function(){
      S=normalise(o);touch();closeSheet();render();toast('Backup ripristinato');
    });
  };
  r.onerror=function(){toast('Non riesco a leggere il file')};
  r.readAsText(file);
}
function clearDemo(){
  S.sessions=S.sessions.filter(function(s){return !s.demo});
  S.techniques=S.techniques.filter(function(t){return !t.demo||S.sessions.some(function(s){return s.items.some(function(i){return i.tid===t.id})})});
  S.demo=false;touch();
  if(!$('#sheet').hidden)closeSheet();
  render();toast('Esempi eliminati');
}

/* ---------- ripasso ---------- */
function startDeck(force){
  var pool=S.techniques.filter(function(t){return (!rf.pos||t.position===rf.pos)&&(!rf.role||t.role===rf.role)});
  var deck=pool.filter(isDue).sort(function(a,b){return a.due<b.due?-1:a.due>b.due?1:a.box-b.box});
  if(!deck.length&&force)deck=pool.slice().sort(function(a,b){return (a.last||'')<(b.last||'')?-1:1}).slice(0,5);
  deck=deck.slice(0,10);
  if(!deck.length)return;
  rv={deck:deck.map(function(t){return t.id}),i:0,revealed:false,ok:0,again:[]};
  window.scrollTo(0,0);render();
}
function rate(good){
  var t=TM[rv.deck[rv.i]];
  if(t){
    if(good){t.box=Math.min(5,t.box+1);rv.ok++}else{t.box=0;rv.again.push(t.id)}
    t.last=today();t.due=addDays(today(),INTERVALS[t.box]);
    touch();
  }
  rv.i++;rv.revealed=false;window.scrollTo(0,0);render();
}

/* ---------- eventi ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,id=el.dataset.id,v=el.dataset.v;
  switch(a){
    case 'tab':view=v;window.scrollTo(0,0);render();break;
    case 'goto-rev':view='ripasso';window.scrollTo(0,0);render();break;
    case 'new-sess':openSession(null);break;
    case 'sess':openSession(id);break;
    case 'new-tech':openTech(null);break;
    case 'tech':openTech(id);break;
    case 'settings':openSettings();break;
    case 'close':closeSheet();render();break;
    case 'kind':dr.kind=v;document.querySelectorAll('#segKind button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.v===v))});break;
    case 'tlevel':td.level=+v;document.querySelectorAll('#segLevel button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.v===v))});break;
    case 'rm-item':dr.items.splice(+el.dataset.i,1);renderItems();renderSugg();break;
    case 'pick':attach(id);break;
    case 'add-tech':addTech();break;
    case 'save-sess':saveSession();break;
    case 'save-tech':saveTech();break;
    case 'del-sess':askConfirm('Elimino questo allenamento? Le tecniche restano in libreria.','Elimina',function(){
      S.sessions=S.sessions.filter(function(s){return s.id!==dr.id});dr._new=[];touch();closeSheet();render();toast('Allenamento eliminato');
    });break;
    case 'del-tech':askConfirm('Elimino «'+td.name+'»? Verrà tolta anche dagli allenamenti in cui compare.','Elimina',function(){
      var tid=td.id,oldT=find(S.techniques,tid);
      if(oldT&&oldT.video)sheetOld.push(oldT.video.id);
      S.techniques=S.techniques.filter(function(t){return t.id!==tid});
      S.sessions.forEach(function(s){s.items=s.items.filter(function(i){return i.tid!==tid})});
      touch();closeSheet();render();toast('Tecnica eliminata');
    });break;
    case 'trole':tf.role=v;render();break;
    case 'rrole':rf.role=v;render();break;
    case 'trole-t':td.role=v;segSet('segTechRole',v);break;
    case 'pkrole':pk.role=v;segSet('segPkRole',v);break;
    case 'cliprole':cd.role=v;segSet('segClipRole',v);break;
    case 'vid-pick':{var vi=$('#vidFile');if(vi)vi.click();break}
    case 'vid-del':askConfirm('Tolgo il video da questa tecnica?','Rimuovi',function(){
      if(td&&td.video){sheetOld.push(td.video.id);td.video=null}
      refreshVid();
    });break;
    case 'pkvid-pick':{var pi=$('#pkFile');if(pi)pi.click();break}
    case 'pkvid-del':if(pk&&pk.video){sheetOld.push(pk.video.id);pk.video=null;refreshPkVid()}break;
    case 'clip-pick':{var ci=$('#clipFile');if(ci&&!clipUp)ci.click();break}
    case 'clip':openClip(id);break;
    case 'clip-save':saveClip();break;
    case 'clip-del':askConfirm('Elimino questo video?','Elimina',function(){
      var c=cd&&find(S.clips,cd.id);
      if(c){sheetOld.push(c.video.id);S.clips=S.clips.filter(function(x){return x.id!==c.id})}
      touch();closeSheet();render();toast('Video eliminato');
    });break;
    case 'tpos':tf.pos=v;render();break;
    case 'rpos':rf.pos=v;render();break;
    case 'rv-start':startDeck(false);break;
    case 'rv-force':startDeck(true);break;
    case 'rv-show':rv.revealed=true;render();break;
    case 'rv-ok':rate(true);break;
    case 'rv-again':rate(false);break;
    case 'rv-stop':rv=null;window.scrollTo(0,0);render();break;
    case 'clear-demo':clearDemo();break;
    case 'bk-save':saveBackup();break;
    case 'bk-copy':copyBackup();break;
    case 'wipe':askConfirm('Cancello tutti gli allenamenti e le tecniche? Se non hai un backup non si recupera nulla.','Cancella tutto',function(){
      S.techniques.forEach(function(t){if(t.video)sheetOld.push(t.video.id)});S.clips.forEach(function(c){sheetOld.push(c.video.id)});
      S=blank();rv=null;touch();closeSheet();render();toast('Dati cancellati');
    });break;
    case 'dlg-no':$('#dlg').hidden=true;dlgCb=null;break;
    case 'dlg-yes':$('#dlg').hidden=true;var cb=dlgCb;dlgCb=null;if(cb)cb();break;
  }
});
function onField(e){
  var t=e.target,d=t.dataset;
  if(d.f!==undefined&&dr){dr[d.f]=t.value;return}
  if(d.it!==undefined&&dr&&dr.items[+d.it]){dr.items[+d.it].note=t.value;return}
  if(d.pk!==undefined&&pk){pk[d.pk]=t.value;if(d.pk==='name')renderSugg();return}
  if(d.c!==undefined&&cd){cd[d.c]=t.value;return}
  if(d.t!==undefined&&td){td[d.t]=t.value;return}
  if(t.id==='tq'){tf.q=t.value;$('#tlist').innerHTML=techList();return}
  if(t.id==='tc'){tf.cat=t.value;$('#tlist').innerHTML=techList();return}
}
document.addEventListener('input',onField);
document.addEventListener('change',function(e){
  if(e.target.id==='vidFile'){var vf=e.target.files&&e.target.files[0];if(vf)attachVideo(vf);e.target.value='';return}
  if(e.target.id==='pkFile'){var pf=e.target.files&&e.target.files[0];if(pf)attachPkVideo(pf);e.target.value='';return}
  if(e.target.id==='clipFile'){var cf=e.target.files&&e.target.files[0];if(cf)quickVideo(cf);e.target.value='';return}
  if(e.target.id==='impFile'){var f=e.target.files&&e.target.files[0];if(f)importFile(f);e.target.value='';return}
  onField(e);
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape')return;
  if(!$('#dlg').hidden){$('#dlg').hidden=true;dlgCb=null;return}
  if(!$('#sheet').hidden){closeSheet();render()}
});

/* ---------- avvio ---------- */
var loc=loadLocal();
S=normalise(loc||demoState());
render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
try{if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}
})();
</script>
</body>
</html>
